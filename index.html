<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Site</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f8fb;
        --text: #1f2937;
        --muted: #667085;
        --accent: #2563eb;
        --panel: #ffffff;
        --border: #e5e7eb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.6;
        color: var(--text);
        background: var(--bg);
      }

      main {
        width: min(720px, calc(100% - 32px));
        margin: 0 auto;
        padding: 96px 0;
      }

      .intro {
        padding: 32px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        box-shadow: 0 16px 48px rgba(31, 41, 55, 0.08);
      }

      h1 {
        margin: 0 0 16px;
        font-size: clamp(2rem, 6vw, 3.5rem);
        line-height: 1.1;
        letter-spacing: 0;
      }

      p {
        margin: 0 0 20px;
        color: var(--muted);
        font-size: 1.05rem;
      }

      a {
        color: var(--accent);
        font-weight: 700;
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      @media (max-width: 560px) {
        main {
          width: min(100% - 24px, 720px);
          padding: 48px 0;
        }

        .intro {
          padding: 24px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="intro" aria-labelledby="page-title">
        <h1 id="page-title">My Site</h1>
        <p>
          GitHub Pagesで公開するシンプルなWebサイトです。
          ここにプロフィール、制作物、連絡先などを追加できます。
        </p>
        <a href="https://github.com/">GitHubを見る</a>
      </section>
    </main>
  </body>
</html>
